spring:
  application:
    name: inventory-system
  profiles:
    default: local
  jpa:
    open-in-view: false
    # ddl-auto로 스키마를 만든 뒤 data.sql(seed)을 실행한다
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 500
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  jackson:
    time-zone: Asia/Seoul
  sql:
    init:
      # src/main/resources/data.sql이 있으면 기동마다 실행한다. 재기동에도 안전하도록 INSERT ... ON CONFLICT DO NOTHING으로 쓴다
      mode: always

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/inventory-system
    username: app
    password: app
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false