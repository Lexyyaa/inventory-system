services:
  postgres:
    image: postgres:17
    container_name: inventory-system-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: inventory-system
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
